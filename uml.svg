<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
<defs><marker id="inherit" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="white" stroke="#334155" stroke-width="1.5"/></marker><marker id="realize" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="white" stroke="#334155" stroke-width="1.5"/></marker><marker id="dependency" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="navigable" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:14px;fill:#172033}.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.head{fill:#e2e8f0}.title{font-weight:bold}.line{stroke:#334155;stroke-width:2;fill:none}.dash{stroke-dasharray:7 5}.label{font-size:12px;fill:#475569}.stereo{font-size:12px;font-style:italic}</style>
<rect class="box" x="415" y="25" width="370" height="112" rx="4"/><rect class="head" x="416" y="26" width="368" height="31"/><text class="stereo" x="600" y="43" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text><text class="title" x="600" y="75" text-anchor="middle">ChoreNotice</text><text x="435" y="100"># sender: NoticeSender</text><text x="435" y="123">+ publish(destination, notice)</text>
<rect class="box" x="145" y="220" width="320" height="100" rx="4"/><text class="title" x="305" y="250" text-anchor="middle">OneTimeChoreNotice</text><text x="165" y="280">+ publish(destination, notice)</text><text class="label" x="165" y="304">Sets Notice.cadence = ONCE</text>
<rect class="box" x="735" y="220" width="320" height="100" rx="4"/><text class="title" x="895" y="250" text-anchor="middle">WeeklyChoreNotice</text><text x="755" y="280">+ publish(destination, notice)</text><text class="label" x="755" y="304">Sets Notice.cadence = WEEKLY</text>
<path class="line" marker-end="url(#inherit)" d="M305 220 L500 137 M895 220 L700 137"/>
<rect class="box" x="445" y="390" width="310" height="100" rx="4"/><rect class="head" x="446" y="391" width="308" height="31"/><text class="stereo" x="600" y="408" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text><text class="title" x="600" y="442" text-anchor="middle">NoticeSender</text><text x="465" y="472">+ send(destination, notice)</text><path class="line" d="M500 137 L500 355 L600 355 L600 390"/><text class="label" x="510" y="348">bridge reference</text>
<rect class="box" x="370" y="550" width="300" height="88" rx="4"/><text class="title" x="520" y="580" text-anchor="middle">NoticeService</text><text x="390" y="605">senders: Map&lt;String, NoticeSender&gt;</text><text x="390" y="627">notices: Map&lt;String, Factory&gt;</text>
<path class="line" marker-end="url(#navigable)" d="M450 550 L450 490"/><text class="label" x="458" y="520">sender map</text><path class="line dash" marker-end="url(#dependency)" d="M370 575 L340 575 L340 90 L415 90"/><text class="label" x="326" y="360" transform="rotate(-90 326 360)">factory creates abstraction</text>
<rect class="box" x="785" y="550" width="300" height="88" rx="4"/><text class="title" x="935" y="580" text-anchor="middle">NoticeRequest</text><text x="805" y="605">notice, format, kind, destination</text><text x="805" y="627">kind is an extensible registry key</text><path class="line" d="M785 594 L670 594"/><text class="label" x="710" y="585">reads</text>
<rect class="box" x="30" y="550" width="285" height="88" rx="4"/><text class="title" x="172" y="580" text-anchor="middle">Notice</text><text x="50" y="605">chore, dueDate, person, priority</text><text x="50" y="625">cadence</text><path class="line" d="M370 615 L315 615"/><text class="label" x="323" y="605">uses</text>
<rect class="box" x="80" y="760" width="220" height="90" rx="4"/><text class="title" x="190" y="790" text-anchor="middle">JsonNoticeSender</text><text x="100" y="818">JSON encoding</text><path class="line dash" marker-end="url(#realize)" d="M190 760 L455 490"/>
<rect class="box" x="350" y="760" width="220" height="90" rx="4"/><text class="title" x="460" y="790" text-anchor="middle">CsvNoticeSender</text><text x="370" y="818">CSV encoding</text><path class="line dash" marker-end="url(#realize)" d="M460 760 L540 490"/>
<rect class="box" x="620" y="760" width="245" height="90" rx="4"/><text class="title" x="742" y="790" text-anchor="middle">HomeScreenAdapter</text><text x="640" y="818">implements NoticeSender</text><path class="line dash" marker-end="url(#realize)" d="M742 760 L640 490"/>
<rect class="box" x="930" y="760" width="240" height="90" rx="4"/><text class="title" x="1050" y="790" text-anchor="middle">OldHomeScreen</text><text x="950" y="818">display(bytes, urgency, name)</text><path class="line" d="M865 805 L930 805"/><text class="label" x="882" y="795">delegates to</text>
<rect class="box" x="330" y="890" width="250" height="70" rx="4"/><text class="title" x="455" y="918" text-anchor="middle">DeliveryException</text><text x="350" y="944">checked; preserves cause</text>
<rect class="box" x="640" y="890" width="280" height="70" rx="4"/><text class="title" x="780" y="918" text-anchor="middle">OldHomeScreenException</text><text x="660" y="944">unchecked legacy exception</text>
<path class="line dash" marker-end="url(#realize)" d="M700 850 L550 890"/><text class="label" x="570" y="870">throws</text><path class="line dash" marker-end="url(#realize)" d="M800 850 L800 890"/><text class="label" x="812" y="875">wraps as cause</text>
<text class="label" x="600" y="690" text-anchor="middle">Format and kind factories are looked up dynamically by NoticeService.</text>
</svg>
